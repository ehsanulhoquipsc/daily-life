<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F4F0" id="themeColor">
<meta name="description" content="Daily Life — plan, track and review your days.">
<title>Daily Life</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
<script>
  // apply theme before first paint (no flash)
  (function () {
    try {
      var d = JSON.parse(localStorage.getItem('dl:v1') || '{}');
      var t = (d.settings && d.settings.theme) || 'auto';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>
  <nav id="nav" aria-label="Main"></nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script src="more.js"></script>
<script src="plan.js"></script>
<script src="speak.js"></script>
<script src="world.js"></script>
</body>
</html>
